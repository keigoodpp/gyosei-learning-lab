name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build _site (exclude docs/card-drafts/ and non-public files)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp app.js _site/
          cp lesson.css lesson.js styles.css _site/
          cp -R lessons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - id: deployment
        uses: actions/deploy-pages@v4
