<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行政書士学習ラボ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>行政書士学習ラボ</h1>
      <p>1論点1ページで合格知識を積み上げよう</p>
    </header>

    <!-- 教材 -->
    <div class="section">
      <div class="section-title">教材</div>
      <a class="lesson-card" href="lessons/shobunsei.html">
        <div class="tag">行政法</div>
        <div class="title">処分性とは何か</div>
        <div class="desc">取消訴訟を提起できる「処分」の意味と判断基準を学ぶ</div>
        <div class="arrow">›</div>
      </a>
      <a class="lesson-card" href="lessons/genkoku-tekikaku.html">
        <div class="tag">行政法</div>
        <div class="title">原告適格とは何か</div>
        <div class="desc">取消訴訟を起こせる「法律上の利益を有する者」の意味を学ぶ</div>
        <div class="arrow">›</div>
      </a>
    </div>

    <!-- 総合ミニクイズ -->
    <div class="section">
      <div class="section-title">総合ミニクイズ</div>
      <div class="card" id="quiz-card">
        <div class="progress" id="progress"></div>
        <div class="question" id="question"></div>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題へ</button>
      </div>
      <div class="card result" id="result-card">
        <p>クイズ終了！</p>
        <div class="score" id="score-text"></div>
        <p id="score-comment"></p>
        <button class="restart-btn" onclick="restart()">もう一度チャレンジ</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
